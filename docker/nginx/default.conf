# Konfiguracja Nginx dla Laravel + Inertia.js (SPA)
# Obsługa PHP-FPM, routing SPA, kompresja, pliki statyczne

server {
    listen 80;
    listen [::]:80;
    
    # Nazwa serwera - zmień na swoją domenę w produkcji
    server_name localhost;

    # Root directory aplikacji Laravel
    root /var/www/html/public;
    
    # Domyślne pliki index
    index index.php index.html;

    # Maksymalny rozmiar uploadu
    client_max_body_size 100M;

    # Kompresja gzip dla lepszej wydajności
    gzip on;
    gzip_vary on;
    gzip_min_length 1024;
    gzip_types text/plain text/css text/xml text/javascript application/x-javascript application/xml+rss application/javascript application/json;

    # Timeout dla długotrwałych requestów
    fastcgi_read_timeout 300;
    proxy_read_timeout 300;

    # Główna lokalizacja - routing dla SPA (Inertia.js)
    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    # Obsługa plików PHP przez PHP-FPM
    location ~ \.php$ {
        try_files $uri =404;
        fastcgi_split_path_info ^(.+\.php)(/.+)$;
        fastcgi_pass app:9000;
        fastcgi_index index.php;
        include fastcgi_params;
        fastcgi_param SCRIPT_FILENAME $document_root$fastcgi_script_name;
        fastcgi_param PATH_INFO $fastcgi_path_info;
        fastcgi_param PHP_VALUE "upload_max_filesize=100M \n post_max_size=100M";
        fastcgi_buffer_size 128k;
        fastcgi_buffers 256 16k;
        fastcgi_busy_buffers_size 256k;
        fastcgi_temp_file_write_size 256k;
    }

    # Obsługa plików statycznych z długim cache
    location ~* \.(jpg|jpeg|png|gif|ico|css|js|svg|woff|woff2|ttf|eot)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        access_log off;
        try_files $uri =404;
    }

    # Blokada dostępu do ukrytych plików
    location ~ /\.(?!well-known).* {
        deny all;
    }

    # Blokada dostępu do wrażliwych katalogów
    location ~ ^/(storage|vendor|bootstrap|config|database|resources|routes|tests)/ {
        deny all;
    }

    # Logi błędów i dostępu
    error_log  /var/log/nginx/error.log;
    access_log /var/log/nginx/access.log;
}
