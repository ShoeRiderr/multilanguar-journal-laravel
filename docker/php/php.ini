; Konfiguracja PHP dla Laravel - optymalizacje dla produkcji

; Upload settings
upload_max_filesize = 100M
post_max_size = 100M

; Limity pamięci i czasu wykonania
memory_limit = 256M
max_execution_time = 300
max_input_time = 300

; OPcache - cache dla skompilowanych skryptów PHP
opcache.enable = 1
opcache.enable_cli = 1
opcache.memory_consumption = 128
opcache.interned_strings_buffer = 8
opcache.max_accelerated_files = 10000
opcache.max_wasted_percentage = 5
opcache.revalidate_freq = 2
opcache.fast_shutdown = 1

; Realpath cache - cache dla ścieżek plików
realpath_cache_size = 4096K
realpath_cache_ttl = 600

; Session settings
session.gc_maxlifetime = 7200

; Error reporting (wyłącz w produkcji)
display_errors = Off
display_startup_errors = Off
log_errors = On
error_log = /var/log/php_errors.log

; Timezone
date.timezone = Europe/Warsaw

; Security
expose_php = Off
