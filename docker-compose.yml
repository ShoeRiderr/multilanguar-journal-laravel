# Konfiguracja Docker Compose dla Laravel 12 + Inertia + Vue 3
# Zoptymalizowane dla Hetzner Cloud CX23 (8GB RAM)
# 
# WAŻNE: Przed uruchomieniem zbuduj assety NA HOŚCIE:
#   npm ci && npm run build
# 
# Następnie uruchom: docker compose up -d

services:
  # PHP-FPM Application
  app:
    build:
      context: .
      dockerfile: Dockerfile
    image: multilanguar-journal-app:latest
    container_name: journal_app
    restart: unless-stopped
    working_dir: /var/www/html
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379
    volumes:
      - ./:/var/www/html
      # Assety zbudowane na hoście są dostępne w kontenerze
      - ./public/build:/var/www/html/public/build
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
      redis:
        condition: service_started
    deploy:
      resources:
        limits:
          memory: 2G
    healthcheck:
      test: ["CMD-SHELL", "php-fpm -t || exit 1"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

  # Nginx Web Server
  nginx:
    image: nginx:alpine
    container_name: journal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
      - ./docker/nginx/ssl:/etc/nginx/ssl
    networks:
      - app-network
    depends_on:
      - app
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost/"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

  # MySQL Database
  mysql:
    image: mysql:8.0
    container_name: journal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_DATABASE: ${DB_DATABASE:-journal_db}
      MYSQL_USER: ${DB_USERNAME:-journal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-secret}
      MYSQL_ROOT_HOST: '%'
    volumes:
      - mysql-data:/var/lib/mysql
      - ./docker/mysql/my.cnf:/etc/mysql/conf.d/my.cnf
    ports:
      - "127.0.0.1:3306:3306"
    networks:
      - app-network
    command: --default-authentication-plugin=mysql_native_password
    deploy:
      resources:
        limits:
          memory: 3G
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_PASSWORD:-secret}"]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 30s

  # Redis Cache & Sessions
  redis:
    image: redis:alpine
    container_name: journal_redis
    restart: unless-stopped
    command: redis-server --appendonly yes
    volumes:
      - redis-data:/data
    networks:
      - app-network
    deploy:
      resources:
        limits:
          memory: 512M
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 3
      start_period: 10s

# Named volumes dla persystencji danych
volumes:
  mysql-data:
    driver: local
  redis-data:
    driver: local

# Sieć prywatna dla kontenerów
networks:
  app-network:
    driver: bridge
