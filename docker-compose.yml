# Konfiguracja Docker Compose dla Laravel 12 + Inertia.js + Vue 3
# Serwisy: app (PHP-FPM), nginx, mysql, redis

services:
  # ==========================================
  # PHP-FPM Application Container
  # ==========================================
  app:
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    container_name: journal_app
    restart: unless-stopped
    working_dir: /var/www/html
    volumes:
      - ./:/var/www/html
      - ./.env:/var/www/html/.env
    networks:
      - app-network
    depends_on:
      mysql:
        condition: service_healthy
    environment:
      - DB_HOST=mysql
      - DB_PORT=3306
      - REDIS_HOST=redis
      - REDIS_PORT=6379

  # ==========================================
  # Nginx Web Server
  # ==========================================
  nginx:
    image: nginx:alpine
    container_name: journal_nginx
    restart: unless-stopped
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - app
    networks:
      - app-network

  # ==========================================
  # MySQL 8.0 Database
  # ==========================================
  mysql:
    image: mysql:8.0
    container_name: journal_mysql
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: ${DB_ROOT_PASSWORD:-root_password}
      MYSQL_DATABASE: ${DB_DATABASE:-journal_db}
      MYSQL_USER: ${DB_USERNAME:-journal_user}
      MYSQL_PASSWORD: ${DB_PASSWORD:-journal_password}
    volumes:
      - mysql-data:/var/lib/mysql
    ports:
      - "3306:3306"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-p${DB_ROOT_PASSWORD:-root_password}"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ==========================================
  # Redis Cache/Queue
  # ==========================================
  redis:
    image: redis:alpine
    container_name: journal_redis
    restart: unless-stopped
    ports:
      - "6379:6379"
    networks:
      - app-network
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 3s
      retries: 3

# ==========================================
# Named Volumes
# ==========================================
volumes:
  mysql-data:
    driver: local

# ==========================================
# Networks
# ==========================================
networks:
  app-network:
    driver: bridge
